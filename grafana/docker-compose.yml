services:
  postgres:
    image: postgres:16-alpine
    container_name: stonks-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stonkstime}
      POSTGRES_USER: ${POSTGRES_USER:-stonkstime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stonkstime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stonkstime} -d ${POSTGRES_DB:-stonkstime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    profiles: [seed]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-stonkstime}
    volumes:
      - ./seed/seed.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -h postgres -U stonkstime -d stonkstime -f /seed.sql"]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: stonks-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-stonkstime}
      POSTGRES_USER: ${POSTGRES_USER:-stonkstime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stonkstime}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
