services:
  grafana:
    image: grafana/grafana:11.4.0
    container_name: stonks-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Auto-install the SQLite datasource plugin on first boot.
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      # Directory holding the mod's Grafana snapshot (stonkstime-grafana.db, non-WAL).
      # Point STONKS_DB_DIR at your world's `stonkstimecore/` folder — the mod writes the
      # snapshot there every grafanaSnapshotIntervalSeconds. Read-only: Grafana only SELECTs.
      # Defaults to ./stonks-data (used by the demo seed below) when STONKS_DB_DIR is unset.
      - ${STONKS_DB_DIR:-./stonks-data}:/var/lib/grafana/stonks:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
