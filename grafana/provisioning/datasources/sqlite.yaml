apiVersion: 1

datasources:
  - name: StonksTime
    uid: stonkstime
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # Path *inside the Grafana container* to the mod's SQLite file.
      # docker-compose mounts the world's stonkstimecore/ directory here (see STONKS_DB_DIR).
      path: /var/lib/grafana/stonks/stonkstime.db
